name: Common Integration Tests

on:
  workflow_call:
    inputs:
      display_name:
        required: true
        type: string
      setup_script:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      integration_tests:
        required: true
        type: string
      integration_environment:
        required: true
        type: string

jobs:
  integration-tests:
    name: Integration tests (${{ inputs.display_name }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform environment
        env:
          CI_STAGE: integration
        run: bash "${{ inputs.setup_script }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-build-isolation
          python -m pip install pytest

      - name: Run configured integration tests
        env:
          INTEGRATION_TESTS: ${{ inputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ inputs.integration_environment }}
        run: |
          set -euo pipefail
          python .github/scripts/run_integration_tests.py
