display_name: CUDA

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env_cuda.sh

ci_image: harbor.baai.ac.cn/flagos/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.0-time2507111538

runner_labels:
  - self-hosted
  - nvidia
  - gpu-8

container_volumes: []

container_options: >-
  --gpus all
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-cuda
