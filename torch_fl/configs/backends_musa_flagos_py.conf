# MUSA native + FlagGems Python hybrid routing.
#
# Native mudnn/muRAND remains authoritative for every schema in
# backends_musa.conf, including all registered RNG and dropout overloads. The
# overrides below are non-overlapping operations implemented by FlagGems'
# MThreads backend. They require a FlagGems Python build and a Triton mtgpu/MUSA
# backend; without that dependency use the native-only backends_musa.conf.
include backends_musa.conf

all = flagos_python
all.dims = flagos_python
any = flagos_python
any.dims = flagos_python
index_add = flagos_python
index_add_ = flagos_python
repeat_interleave.Tensor = flagos_python
