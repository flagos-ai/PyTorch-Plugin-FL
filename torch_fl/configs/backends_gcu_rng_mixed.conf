# Targeted Enflame GCU RNG coexistence configuration.
#
# The production GCU table remains native-first. This test table proves that
# FlagGems and topsaten kernels coexist behind the same PrivateUse1 wrappers and
# consume one per-device seed/offset stream in a single process.
include backends_gcu.conf

randn = flagos_python
exponential_ = gcu
