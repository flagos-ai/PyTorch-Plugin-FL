# --- Probe artifacts, deliberately still routed ---
# The direct-call cross-check flagged these, but the cause was the probe's own
# argument choice or a missing route for an op the kernel decomposes to, not the
# op under test. Each was re-checked by hand and works.
#
# Bad probe argument (the probe's tensor+scalar form passes 2 as arg 2):
#   logit: 2 is out of range for eps; logit(x), logit(x,1e-6), logit(x,0.1) and
#     logit_ all match CPU to 6.7e-08
#   logit_: same as logit
#   repeat_interleave.Tensor: probe passed a 2D tensor; repeat_interleave(x,2) works
#   clamp: probe passed no min/max; clamp(x,-1,1) and clamp(x,min=-1) both work
#   clamp.Tensor / clamp_ / clamp_.Tensor: same as clamp
#
# Reaches an op that has no route on this backend (a hole in the aclnn baseline,
# which would equally affect the aclnn path -- not a gems defect):
#   aminmax: needs squeeze.dims; aminmax(x) works
#   std.correction: needs squeeze.dims; std(x) works
#   prod: probe's dim= form lands on prod.dim_int, held back above; prod(x) works
#   where.self: needs nonzero; where(x>0,x,x) works
#   where.self_out: same as where.self

