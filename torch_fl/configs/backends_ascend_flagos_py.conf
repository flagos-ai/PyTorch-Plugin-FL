# Ascend + FlagGems hybrid config
# With prefer_block_pointer=False (via _patch_flaggems_codegen_config), FlagGems
# Triton kernels avoid the triton-ascend block pointer compiler bug.
#
# NOTE: flagos_python backend requires FLAGGEMS_PYTHON=1 (or FLAGGEMS_KERNEL=1) at build time.
# When both are 0, all ops must use 'ascend' backend.

# Inherit the full aclnn baseline (223 ops), then override only the ops that have
# a verified-working FlagGems Triton kernel. Later assignments win.
#
# This file used to restate every route explicitly, which rotted: codegen kept
# appending ops to the baseline while this file stayed at 55 entries, so 168 ops
# resolved to no conf entry at all -> Backend::kFlagOs, which has no kernel
# registered in an Ascend build. That surfaced as e.g.
# `RuntimeError: ones: backend not registered` the moment FLAGOS_USE_FLAGGEMS=1
# touched anything outside the hand-listed set. Inheriting means a new codegen op
# lands on aclnn automatically and only needs a line here once its FlagGems
# kernel is verified.
include backends_ascend.conf

# --- FlagGems Triton kernels (via python_op_caller) ---
# Only ops verified elementwise-correct against a CPU reference on real 910
# hardware belong here. Everything else stays on the inherited aclnn route.
abs = flagos_python
all = flagos_python
bitwise_and.Tensor = flagos_python
constant_pad_nd = flagos_python
cos = flagos_python
le.Tensor = flagos_python
mul.Tensor = flagos_python
neg = flagos_python
nll_loss_forward = flagos_python
nll_loss_backward = flagos_python
pow.Tensor_Scalar = flagos_python
rsqrt = flagos_python
silu = flagos_python
silu_backward = flagos_python
sin = flagos_python
_softmax = flagos_python
where.self = flagos_python

# --- Deliberately held on aclnn (inherited, restated here as documentation) ---
# These have a FlagGems kernel that is either broken on triton-ascend or
# semantically wrong; the notes are the reason each one is not promoted above.
acos = ascend  # triton-ascend compiler error at line 45/28
add.Tensor = ascend  # gems add() drops the aten `alpha` arg -> silent wrong result
bmm = ascend  # FlagGems uses SPLIT_K kwarg not supported by triton-ascend
bmm.out = ascend  # same as bmm
cat = ascend  # triton-ascend compiler crashes (ConvertTritonIRToLinalgIR) on 4D shapes
mean.dim = ascend  # FlagGems non-inner dim path uses CUDA context, fails on ascend
mm = ascend  # FlagGems uses SPLIT_K kwarg not supported by triton-ascend
mm.out = ascend  # same as mm
matmul = ascend  # route aten::matmul directly to aclnnMatmul, bypasses view churn
mul.Scalar = ascend  # excluded from codegen flaggems-python discovery (arity/type gate)
sum.dim_IntList = ascend  # excluded from codegen flaggems-python discovery (arity/type gate)
index.Tensor = ascend  # excluded from codegen flaggems-python discovery (optlist special-handling)
empty_like = ascend  # FlagGems pointwise_dynamic allocates outputs via torch.empty_like
