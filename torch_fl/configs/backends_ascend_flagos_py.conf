# --- Held on aclnn: measured broken on the FlagGems path ---

# returns out-of-range indices for any dim= argument (1 ops)
# torch.argmin(x, dim=-1) on a (3,5) tensor returned [8, 3, 2] where CPU gives
# [3, 3, 2] -- 8 is past the end of a length-5 row, so the kernel is producing a
# flat index instead of a per-row one. Wrong in 4/4 trials for dim=-1, dim=1 and
# dim=-1+keepdim. Full-reduce argmin(x) is correct, and argmax is correct in every
# form, so only argmin is held back.
# The first sweep missed this: its probe used dim=0, which lands on a separately
# held overload, so the one call that would have caught it never ran.
argmin = ascend

# generated qualname names a gems module/attr that does not exist (5 ops)
# The codegen derives the qualname from the aten overload, so the inplace/out
# spelling becomes flag_gems.ops.<op>_.<op>_ (e.g. addcdiv_) or
# flag_gems.ops.log1p.log1p_out -- neither the module nor the attribute is
# there, and the flag_gems.ops fallback added for the _hygon qualnames cannot
# help because the attribute name itself is wrong. Every one raises
# AttributeError on first call.
#
# The sweep passed them because OpInfo drives the functional overload: the
# harness routes addcdiv_ but info.op is torch.addcdiv, so the inplace kernel is
# never entered. This is a third blind spot alongside the two noted at the top.
# Caught by test_foreach_dispatch's AdamW case, which calls addcdiv_ directly.
addcdiv_ = ascend
log1p.out = ascend
logical_not_ = ascend
logical_xor_ = ascend
trunc_ = ascend

# nondeterministic wrong results / unregistered inner op (3 ops)
# isin passed both the OpInfo sample and the direct-call probe (the probe skipped
# it: torch.isin needs two args, so every probe call raised TypeError and was
# treated as "signature does not accept this shape of call"). Measured by hand:
#   * Tensor_Tensor returns garbage that varies between identical runs -- the same
#     torch.isin(tensor([[6722]]), tensor([151645,151643])) gave False standalone
#     and True inside generate, and a random 4x5 trial dropped both real matches.
#     Reads look uninitialized rather than merely imprecise.
#   * Tensor_Scalar/Scalar_Tensor hit gems' `torch.tensor(in1, device=...)` path
#     -> RuntimeError: detach_: backend not registered.
# This one silently truncated Qwen3 generation: transformers' EosTokenCriteria is
# torch.isin(input_ids[:, -1:], eos).any(-1), so a false positive on an ordinary
# token ends the sequence 12 tokens early with no error.
isin.Scalar_Tensor = ascend
isin.Tensor_Scalar = ascend
isin.Tensor_Tensor = ascend

