# Ascend + FlagGems hybrid config
#
# NOTE: flagos_python requires FLAGGEMS_PYTHON=1 (or FLAGGEMS_KERNEL=1) at build
# time. When both are 0, all ops must use the 'ascend' backend.
#
# Inherit the full aclnn baseline, then override only the ops whose FlagGems
# Triton kernel was MEASURED correct on real 910 hardware. Later assignments win.
#
# Produced by scripts/verify_flaggems_ascend.py, which for each op (a) drives it
# with its PyTorch OpInfo sample inputs and compares against a CPU reference
# (tol 2e-2, loose enough to absorb HF32 cube accumulation), and (b) re-drives it
# through a plain torch.<op> call. Step (b) is not redundant: randn and mean.dim
# both pass (a) and fail (b), because OpInfo can reach an op by a different route
# or supply shapes that miss a branch inside the gems kernel.
#
# Neither step is sufficient on its own, and neither is sufficient overall: isin
# passed both and still returns nondeterministic garbage (see its note below). An
# op is only as verified as the calls it was actually driven with.
#
# Of the 390 candidates with a generated kernel that CUDA also routes to gems:
#   202 verified working  -> flagos_python (below)
#   98 measured broken    -> held on aclnn, grouped by cause
#   90 not auto-testable  -> inherit aclnn, listed at the end
#
# Static gates cannot substitute for this: all 390 pass their arity/type checks
# and then a quarter fail at runtime. Do not promote an op without a measurement.
include backends_ascend.conf

